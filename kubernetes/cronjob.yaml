apiVersion: batch/v1
kind: CronJob
metadata:
  name: main-process-cronjob
  namespace: default # O el namespace que uses con ArgoCD
  labels:
    app: main-process
spec:
  schedule: "*/5 * * * *" # O tu horario deseado
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: main-process
            image: carlosmoreno7/main-process:latest # ¡Asegúrate de que este tag sea correcto!
            imagePullPolicy: Always # <--- ¡ESTO ES CLAVE!
            envFrom: # Para inyectar las credenciales desde el Secret
            - secretRef:
                name: main-process-secrets
          restartPolicy: OnFailure
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1